<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>買い出しリスト🛒</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #F9F7F2;
  --accent-orange: #E26D43;
  --accent-blue: #84A3BF;
  --accent-blue-light: #B8CDD9;
  --text-main: #4A433F;
  --text-muted: #A89F9A;
  --white: #FFFFFF;
  --card-shadow: 0 10px 25px rgba(0,0,0,0.04);
  --border: #EBE6DF;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Zen Maru Gothic', sans-serif;
  background-color: var(--bg-base);
  color: var(--text-main);
  padding-bottom: 24px;
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}

/* ===== Header ===== */
.header {
  background: var(--white);
  padding: 22px 20px 18px;
  text-align: center;
  border-bottom-left-radius: 30px;
  border-bottom-right-radius: 30px;
  box-shadow: var(--card-shadow);
  position: sticky; top: 0; z-index: 100;
}
.header-title {
  font-size: 19px;
  font-weight: 700;
  color: var(--accent-orange);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin-bottom: 14px;
  letter-spacing: 0.04em;
}

/* ===== User bar ===== */
.user-bar {
  display: flex; gap: 7px; flex-wrap: wrap; justify-content: center;
}
.user-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 2px solid var(--border);
  font-size: 12px;
  font-family: 'Zen Maru Gothic', sans-serif;
  font-weight: 700;
  cursor: pointer;
  background: var(--bg-base);
  color: var(--text-muted);
  transition: all 0.18s;
  -webkit-tap-highlight-color: transparent;
}
.user-btn.active { color: var(--white); }
.user-btn[data-user="後河内"].active { background: var(--accent-blue);   border-color: var(--accent-blue); }
.user-btn[data-user="吉村"].active  { background: var(--accent-orange);  border-color: var(--accent-orange); }
.user-btn[data-user="吉本"].active  { background: #5BA87A; border-color: #5BA87A; }
.user-btn[data-user="川田"].active  { background: #A878C8; border-color: #A878C8; }

/* ===== リスト部分を通常のゴシック体にする ===== */
.store-name, 
.item-name, 
.item-memo,
.modal-input {
  /* 丸文字を解除し、標準的なゴシック体セットを指定 */
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif !important;
}

/* メモなどは少し細めが見やすいため調整 */
.item-memo {
  font-weight: 400; 
}

/* ===== Sync bar ===== */
.sync-bar {
  background: var(--accent-blue);
  padding: 9px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sync-status {
  font-size: 11px; font-weight: 700;
  color: rgba(255,255,255,0.85);
  display: flex; align-items: center; gap: 5px;
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #6EE89A;
  display: inline-block;
  animation: pulse 1.8s ease-in-out infinite;
}
.live-dot.sending { background: #FAC96A; animation: none; }
.live-dot.error   { background: #F08080; animation: none; }
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.45; transform: scale(0.85); }
}
.sync-btn {
  background: rgba(255,255,255,0.22);
  color: var(--white);
  border: 1.5px solid rgba(255,255,255,0.35);
  padding: 6px 13px;
  border-radius: 14px;
  font-size: 11px;
  font-family: 'Zen Maru Gothic', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s;
  -webkit-tap-highlight-color: transparent;
}
.sync-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.35); }

/* ===== Main ===== */
.container { max-width: 500px; margin: 0 auto; padding: 16px 14px; }

/* ===== Store card ===== */
.store-card {
  background: var(--white);
  border-radius: 24px;
  margin-bottom: 12px;
  box-shadow: var(--card-shadow);
  overflow: hidden;
}
.store-header {
  display: flex; align-items: center;
  padding: 15px 18px;
  cursor: pointer; gap: 10px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.store-icon {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.store-name { flex: 1; font-size: 15px; font-weight: 700; color: var(--text-main); }
.store-count {
  font-size: 11px; font-weight: 700;
  color: var(--text-muted);
  background: var(--bg-base);
  padding: 3px 10px; border-radius: 12px;
}
.store-arrow {
  width: 20px; height: 20px; flex-shrink: 0;
  color: var(--text-muted); transition: transform 0.25s;
}
.store-card.open .store-arrow { transform: rotate(180deg); }
.store-body { max-height: 0; overflow: hidden; transition: max-height 0.32s ease; }
.store-card.open .store-body { max-height: 3000px; }
.items-list { border-top: 1.5px solid var(--bg-base); padding: 4px 0; }

/* ===== Item row ===== */
.item-row {
  display: flex; align-items: flex-start;
  padding: 11px 18px; gap: 11px;
  border-bottom: 1px solid var(--bg-base);
  transition: opacity 0.18s;
}
.item-row:last-child { border-bottom: none; }
.item-row.done-row { opacity: 0.5; }

.custom-cb {
  width: 24px; height: 24px; border-radius: 8px;
  border: 2.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.18s;
  background: var(--white); flex-shrink: 0; margin-top: 1px;
  -webkit-tap-highlight-color: transparent;
}
.custom-cb.checked-後河内 { background: var(--accent-blue);  border-color: var(--accent-blue); }
.custom-cb.checked-吉村   { background: var(--accent-orange); border-color: var(--accent-orange); }
.custom-cb.checked-吉本   { background: #5BA87A; border-color: #5BA87A; }
.custom-cb.checked-川田   { background: #A878C8; border-color: #A878C8; }
.check-mark { display: none; color: var(--white); font-size: 13px; font-weight: 700; line-height: 1; }
.custom-cb.checked .check-mark { display: block; }

.item-content { flex: 1; min-width: 0; }
.item-name { font-size: 14px; font-weight: 700; line-height: 1.45; color: var(--text-main); transition: all 0.18s; }
.item-name.done { color: var(--text-muted); text-decoration: line-through; }
.item-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.item-memo { font-size: 11px; color: var(--text-muted); }

.checker-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
.badge-後河内 { background: #E8F4FB; color: #4A7FA8; }
.badge-吉村   { background: #FBF0EC; color: #C04820; }
.badge-吉本   { background: #EAF5EE; color: #2A6A40; }
.badge-川田   { background: #F5EEF9; color: #7A48A0; }

/* ===== Add buttons ===== */
.add-item-row { padding: 10px 18px; }
.add-btn {
  width: 100%; padding: 10px;
  border: 2px dashed var(--accent-blue-light);
  background: transparent; border-radius: 14px;
  color: var(--accent-blue);
  font-size: 13px; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.18s;
  -webkit-tap-highlight-color: transparent;
}
.add-btn:active { background: rgba(132,163,191,0.08); }

.add-store-btn {
  width: 100%; padding: 14px;
  border: 2px dashed var(--border);
  background: transparent; border-radius: 20px;
  color: var(--text-muted);
  font-size: 13px; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all 0.18s; margin-top: 4px;
  -webkit-tap-highlight-color: transparent;
}
.add-store-btn:active { background: rgba(0,0,0,0.03); }

/* ===== Modal ===== */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(74,67,63,0.45);
  z-index: 200; align-items: flex-end; justify-content: center;
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--white);
  border-radius: 28px 28px 0 0;
  padding: 18px 20px 44px;
  width: 100%; max-width: 500px;
  animation: slideUp 0.26s ease;
}
@keyframes slideUp {
  from { transform: translateY(60px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.modal-handle {
  width: 36px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 0 auto 18px;
}
.modal-title { font-size: 15px; font-weight: 700; color: var(--accent-orange); margin-bottom: 16px; }
.modal-label { font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 5px; }
.modal-input {
  width: 100%; padding: 11px 14px;
  border: 2px solid var(--bg-base); border-radius: 14px;
  font-size: 16px; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700;
  color: var(--text-main); outline: none; background: var(--bg-base); margin-bottom: 12px;
}
.modal-input:focus { border-color: var(--accent-blue); background: var(--white); }
.modal-actions { display: flex; gap: 8px; margin-top: 6px; }
.modal-cancel {
  flex: 1; padding: 12px;
  border: 2px solid var(--border); background: transparent; border-radius: 14px;
  font-size: 14px; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700;
  cursor: pointer; color: var(--text-muted);
}
.modal-save {
  flex: 2; padding: 12px;
  background: var(--accent-orange); border: none; border-radius: 14px;
  font-size: 14px; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700;
  cursor: pointer; color: var(--white);
}

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--text-main); color: var(--white);
  padding: 10px 22px; border-radius: 22px;
  font-size: 13px; font-weight: 700; font-family: 'Zen Maru Gothic', sans-serif;
  opacity: 0; transition: all 0.3s; z-index: 300;
  white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <ellipse cx="12" cy="5"  rx="3.8" ry="4.8" fill="#84A3BF" opacity="0.75"/>
      <ellipse cx="12" cy="19" rx="3.8" ry="4.8" fill="#84A3BF" opacity="0.75"/>
      <ellipse cx="5"  cy="12" rx="4.8" ry="3.8" fill="#84A3BF" opacity="0.75"/>
      <ellipse cx="19" cy="12" rx="4.8" ry="3.8" fill="#84A3BF" opacity="0.75"/>
      <ellipse cx="6.8"  cy="6.8"  rx="3.4" ry="3.4" fill="#E26D43" opacity="0.55"/>
      <ellipse cx="17.2" cy="6.8"  rx="3.4" ry="3.4" fill="#E26D43" opacity="0.55"/>
      <ellipse cx="6.8"  cy="17.2" rx="3.4" ry="3.4" fill="#E26D43" opacity="0.55"/>
      <ellipse cx="17.2" cy="17.2" rx="3.4" ry="3.4" fill="#E26D43" opacity="0.55"/>
      <circle cx="12" cy="12" r="3.8" fill="#E26D43"/>
    </svg>
    買い出しリスト 🛒
  </div>
  <div class="user-bar">
    <button class="user-btn" data-user="後河内" onclick="selectUser('後河内')">後河内</button>
    <button class="user-btn" data-user="吉村"  onclick="selectUser('吉村')">吉村</button>
    <button class="user-btn" data-user="吉本"  onclick="selectUser('吉本')">吉本</button>
    <button class="user-btn" data-user="川田"  onclick="selectUser('川田')">川田</button>
  </div>
</div>

<div class="sync-bar">
  <span class="sync-status">
    <span class="live-dot" id="liveDot"></span>
    <span id="syncStatus">接続中...</span>
  </span>
  <button class="sync-btn" id="syncBtn" onclick="fetchLatest()">↓ 今すぐ取得</button>
</div>

<div class="container">
  <div id="storesList"></div>
</div>

<!-- 商品追加モーダル -->
<div class="modal-bg" id="itemModalBg">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ 商品を追加</div>
    <label class="modal-label">商品名 *</label>
    <input class="modal-input" id="newItemName" placeholder="例：牛乳">
    <label class="modal-label">メモ（任意）</label>
    <input class="modal-input" id="newItemMemo" placeholder="例：3パック・低脂肪">
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeItemModal()">キャンセル</button>
      <button class="modal-save" onclick="saveItem()">追加する ＋</button>
    </div>
  </div>
</div>



<!-- 店舗追加モーダル -->
<div class="modal-bg" id="storeModalBg">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">🏪 店舗を追加</div>
    <label class="modal-label">店舗名 *</label>
    <input class="modal-input" id="newStoreName" placeholder="例：イオン">
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeStoreModal()">キャンセル</button>
      <button class="modal-save" onclick="saveStore()">追加する ＋</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxHYI_EQWPVxKmicCZAZmjteAMFpUxWtmfmatwLOMsgKNs8x9ILaq6IisFw4qwv16ndzA/exec';

const STORE_COLORS = [
  { bg:'#EBF5FB', emoji:'🛒' },
  { bg:'#FBF0EC', emoji:'🏪' },
  { bg:'#EAF5EE', emoji:'🥬' },
  { bg:'#F5EEF9', emoji:'🏬' },
  { bg:'#FFF8EC', emoji:'🏮' },
];

let currentUser = null;
let addTargetStore = null;

function loadLocal() {
  try { return JSON.parse(localStorage.getItem('kaidashi_data')) || null; } catch { return null; }
}
function saveLocal() {
  try { localStorage.setItem('kaidashi_data', JSON.stringify(data)); } catch {}
}

let data = loadLocal() || {
  stores: [],
  openStores: {}
};

// ===== ステータス表示 =====
function setStatus(state, text) {
  const dot = document.getElementById('liveDot');
  const st  = document.getElementById('syncStatus');
  dot.className = 'live-dot' + (state === 'sending' ? ' sending' : state === 'error' ? ' error' : '');
  st.textContent = text;
}

// ===== GAS へ送信（fire & forget、UIはブロックしない） =====
async function pushToGAS() {
  setStatus('sending', '送信中...');
  try {
    const res    = await fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'sync', data }) });
    const result = await res.json();
    if (result.success && result.data) {
      // 他の人が追加した店舗・商品をマージ（自分のopenStatesは保持）
      mergeRemote(result.data);
    }
    const t = new Date();
    setStatus('live', `更新: ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`);
  } catch {
    setStatus('error', '送信失敗（オフライン？）');
  }
}

// ===== リモートデータをローカルにマージ =====
function mergeRemote(remote) {
  const open = data.openStores;
  // リモートの店舗・商品を基準に、ローカルにないものを追加
  remote.stores.forEach(rStore => {
    const local = data.stores.find(s => s.id === rStore.id);
    if (!local) {
      data.stores.push(rStore); // 他の人が追加した店舗をそのまま追加
    } else {
      rStore.items.forEach(rItem => {
        const li = local.items.find(i => i.id === rItem.id);
        if (!li) local.items.push(rItem); // 他の人が追加した商品を追加
        // チェック状態はリモートを優先（最新が正）
        else { li.checked = rItem.checked; li.checker = rItem.checker; }
      });
    }
  });
  data.openStores = open;
  saveLocal(); render();
}

// ===== 1分ごとに自動ポーリング =====
async function fetchLatest() {
  const btn = document.getElementById('syncBtn');
  btn.textContent = '取得中…';
  try {
    const res    = await fetch(GAS_URL + '?action=get&t=' + Date.now());
    const result = await res.json();
    if (result.success && result.data) mergeRemote(result.data);
    const t = new Date();
    setStatus('live', `更新: ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`);
    showToast('✅ 最新データを取得しました');
  } catch {
    setStatus('error', '取得失敗');
    showToast('⚠ 取得に失敗しました');
  }
  btn.textContent = '↓ 今すぐ取得';
}

function startPolling() {
  setInterval(async () => {
    try {
      const res    = await fetch(GAS_URL + '?action=get&t=' + Date.now());
      const result = await res.json();
      if (result.success && result.data) mergeRemote(result.data);
      const t = new Date();
      setStatus('live', `更新: ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`);
    } catch {
      setStatus('error', 'オフライン');
    }
  }, 60000);
}

// ===== ユーザー選択 =====
function selectUser(name) {
  currentUser = name;
  document.querySelectorAll('.user-btn').forEach(b => b.classList.toggle('active', b.dataset.user === name));
  showToast(`${name} さんとして操作中 ✓`);
}

function toggleStore(sid) {
  data.openStores[sid] = !data.openStores[sid];
  render();
}

function toggleItem(sid, iid) {
  if (!currentUser) { showToast('⬆ 先にユーザーを選択してください'); return; }
  const item = data.stores.find(s => s.id === sid).items.find(i => i.id === iid);
  item.checked = !item.checked;
  item.checker = item.checked ? currentUser : null;
  saveLocal(); render();
  pushToGAS(); // ← チェックのたびに自動送信
}

function openItemModal(sid) {
  if (!currentUser) { showToast('⬆ 先にユーザーを選択してください'); return; }
  addTargetStore = sid;
  document.getElementById('newItemName').value = '';
  document.getElementById('newItemMemo').value = '';
  document.getElementById('itemModalBg').classList.add('show');
  setTimeout(() => document.getElementById('newItemName').focus(), 120);
}
function closeItemModal() {
  document.getElementById('itemModalBg').classList.remove('show');
  addTargetStore = null;
}
function saveItem() {
  const name = document.getElementById('newItemName').value.trim();
  if (!name) { showToast('商品名を入力してください'); return; }
  const memo = document.getElementById('newItemMemo').value.trim();
  data.stores.find(s => s.id === addTargetStore).items.push(
    { id:'i'+Date.now(), name, memo, checked:false, checker:null }
  );
  closeItemModal(); saveLocal(); render();
  showToast(`「${name}」を追加しました ✓`);
  pushToGAS(); // ← 商品追加のたびに自動送信
}


function openStoreModal() {
  document.getElementById('newStoreName').value = '';
  document.getElementById('storeModalBg').classList.add('show');
  setTimeout(() => document.getElementById('newStoreName').focus(), 120);
}
function closeStoreModal() { document.getElementById('storeModalBg').classList.remove('show'); }
function saveStore() {
  const name = document.getElementById('newStoreName').value.trim();
  if (!name) { showToast('店舗名を入力してください'); return; }
  const sid = 's' + Date.now();
  data.stores.push({ id:sid, name, items:[] });
  data.openStores[sid] = true;
  closeStoreModal(); saveLocal(); render();
  showToast(`「${name}」を追加しました ✓`);
  pushToGAS(); // ← 店舗追加のたびに自動送信
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

function render() {
  const list = document.getElementById('storesList');
  list.innerHTML = '';
  data.stores.forEach((store, si) => {
    const col    = STORE_COLORS[si % STORE_COLORS.length];
    const isOpen = !!data.openStores[store.id];
    const done   = store.items.filter(i => i.checked).length;
    const total  = store.items.length;
    const card   = document.createElement('div');
    card.className = 'store-card' + (isOpen ? ' open' : '');
    card.innerHTML = `
      <div class="store-header" onclick="toggleStore('${store.id}')">
        <div class="store-icon" style="background:${col.bg}">${col.emoji}</div>
        <div class="store-name">${store.name}</div>
        <div class="store-count">${done}/${total}</div>
        <svg class="store-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M5 7.5l5 5 5-5"/>
        </svg>
      </div>
      <div class="store-body">
        <div class="items-list">
          ${store.items.map(item => `
            <div class="item-row${item.checked ? ' done-row' : ''}">
              <div class="custom-cb${item.checked ? ' checked checked-'+item.checker : ''}"
                   onclick="toggleItem('${store.id}','${item.id}')">
                <span class="check-mark">✓</span>
              </div>
              <div class="item-content">
                <div class="item-name${item.checked ? ' done' : ''}">${item.name}</div>
                <div class="item-meta">
                  ${item.memo    ? `<span class="item-memo">📝 ${item.memo}</span>` : ''}
                  ${item.checker ? `<span class="checker-badge badge-${item.checker}">${item.checker}</span>` : ''}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="add-item-row">
          <button class="add-btn" onclick="openItemModal('${store.id}')">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M7 1v12M1 7h12"/>
            </svg>
            商品を追加
          </button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  const addStoreDiv = document.createElement('div');
  addStoreDiv.innerHTML = `
    <button class="add-store-btn" onclick="openStoreModal()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 2v12M2 8h12"/>
      </svg>
      店舗を追加
    </button>
  `;
  list.appendChild(addStoreDiv);
}

document.getElementById('itemModalBg').addEventListener('click', function(e) { if (e.target===this) closeItemModal(); });
document.getElementById('storeModalBg').addEventListener('click', function(e) { if (e.target===this) closeStoreModal(); });
document.getElementById('newItemMemo').addEventListener('keydown', e => { if (e.key==='Enter') saveItem(); });
document.getElementById('newStoreName').addEventListener('keydown', e => { if (e.key==='Enter') saveStore(); });

render();
fetchLatest();  // 起動時に最新を取得
startPolling(); // 5秒ごとに自動更新
</script>
</body>
</html>
